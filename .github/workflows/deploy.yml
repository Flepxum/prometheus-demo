
name: Go Prometheus CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Go
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 3. 下载依赖
      - name: Download dependencies
        run: go mod download

      # 4. 单元测试
      - name: Run tests
        run: go test -v ./...

      # 5. 代码检查
      - name: Run vet
        run: go vet ./...

      # 6. 编译
      - name: Build
        run: go build -v -o prometheus-demo .

      # # 7. Docker 镜像构建（可选）
      # - name: Build Docker image
      #   run: docker build -t prometheus-demo:latest .
      # 登录 GitHub Container Registry
      - name: Login GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      # 构建 Docker 镜像
      - name: Build Docker image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}

          docker build -t $IMAGE:latest .
          docker tag $IMAGE:latest $IMAGE:$GITHUB_SHA

      # 推送 Docker 镜像
      - name: Push Docker image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}

          docker push $IMAGE:latest
          docker push $IMAGE:$GITHUB_SHA
