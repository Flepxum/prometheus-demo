services:
  go-app:
    image: ghcr.io/staticlock/prometheus-demo:latest
    container_name: go-app
    restart: always
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - go-app

volumes:
  prometheus-data: